<div class="workspace">
  <!-- ===== Gauche : liste des biens ===== -->
  <aside class="list-panel">
    <div class="list-head">
      <div class="page-title">
        <h1>Liste des biens</h1>
        <p class="subtitle">{{ total() }} bien(s) enregistré(s)</p>
      </div>
      @if (canCreate) {
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="mode() !== 'view' || !lookups()"
          (click)="startCreate()"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          Nouveau
        </button>
      }
    </div>

    <div class="list-filters">
      <input
        type="search"
        class="search"
        [formControl]="search"
        placeholder="Rechercher (désignation ou code)…"
        aria-label="Rechercher"
      />
      <select [formControl]="categoryId" aria-label="Filtrer par catégorie">
        <option [ngValue]="null">Toutes les catégories</option>
        @for (category of lookups()?.categories; track category.id) {
          <option [ngValue]="category.id">{{ category.label }}</option>
        }
      </select>
      <select [formControl]="stateId" aria-label="Filtrer par état">
        <option [ngValue]="null">Tous les états</option>
        @for (state of lookups()?.states; track state.id) {
          <option [ngValue]="state.id">{{ state.label }}</option>
        }
      </select>
    </div>

    @if (error(); as message) {
      <div class="alert alert-error list-alert" role="alert">{{ message }}</div>
    }

    <div class="list-scroll" #listScroll>
      @if (loading()) {
        <div class="progress" role="progressbar" aria-label="Chargement"></div>
      }
      @for (asset of assets(); track asset.id) {
        <button
          type="button"
          class="asset-item"
          [class.selected]="asset.id === selectedId()"
          [class.locked]="mode() !== 'view'"
          [attr.aria-current]="asset.id === selectedId() ? 'true' : null"
          (click)="select(asset.id)"
        >
          <span class="asset-main">
            <span class="asset-name">{{ asset.designation }}</span>
            <span class="asset-meta"
              ><span class="code">{{ asset.code }}</span> · {{ asset.category.label }}</span
            >
          </span>
          <span class="asset-side">
            <span class="badge" [class]="stateClass(asset.state.label)">{{
              asset.state.label
            }}</span>
            <span class="asset-value">{{ asset.acquisitionValue | number: '1.0-0' }}</span>
          </span>
        </button>
      } @empty {
        <p class="empty">{{ loading() ? 'Chargement…' : 'Aucun bien trouvé.' }}</p>
      }
    </div>

    <div class="list-footer">
      <span>Page {{ page() }} / {{ pageCount() }}</span>
      <div class="pager">
        <button
          type="button"
          class="btn btn-sm"
          [disabled]="page() <= 1"
          (click)="goTo(page() - 1)"
        >
          Précédent
        </button>
        <button
          type="button"
          class="btn btn-sm"
          [disabled]="page() >= pageCount()"
          (click)="goTo(page() + 1)"
        >
          Suivant
        </button>
      </div>
    </div>
  </aside>

  <!-- ===== Droite : détail / modification / création ===== -->
  <app-asset-panel
    [assetId]="selectedId()"
    [mode]="mode()"
    [lookups]="lookups()"
    (editRequested)="mode.set('edit')"
    (cancelled)="cancel()"
    (saved)="onSaved($event)"
  />
</div>
