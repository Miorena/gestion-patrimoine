<div class="login-wrapper">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Connexion</h1>
    <p class="muted">Gestion du patrimoine</p>

    @if (error(); as message) {
      <div class="alert alert-error" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">Saisissez une adresse e-mail valide.</small>
      }
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">Le mot de passe est obligatoire.</small>
      }
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</div>
